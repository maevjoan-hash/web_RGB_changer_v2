<!DOCTYPE html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Конфигуратор на мишка - Стандартна (Офис)</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="space-background"></canvas>

    <main class="app glass-panel">
      <header class="app-header">
        <a href="index.html" class="back-button">
          <svg viewBox="0 0 24 24" class="back-icon" aria-hidden="true">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
          Назад
        </a>

        <button type="button" id="connected-devices-btn" class="back-button">
          <svg viewBox="0 0 24 24" class="back-icon" aria-hidden="true">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
          </svg>
          Свързани
        </button>
      </header>

      <div class="layout-switcher">
        <button type="button" class="connected-devices-btn layout-switcher__btn">
          Видове мишки ▾
        </button>
        <div id="layout-options" class="layout-options">
          <a href="mouse.html" class="layout-option active" aria-current="page">Стандартна (Офис) • 3–5 бутона</a>
          <a href="mouse-gaming.html" class="layout-option">Геймърска (FPS/Action) • 6–9 бутона</a>
        </div>
      </div>

      <section id="device-preview" class="device-preview mouse-preview" aria-label="Визуализация на мишка">
        <div id="device-display-area" class="device-display-area mouse-display-area">
          <div class="mouse-stage">
            <svg class="mouse-svg mouse-svg--office" viewBox="0 0 320 420" role="group" aria-label="Ергономична офис мишка">
              <path d="M 156 34 C 214 32 254 74 262 136 C 270 200 266 270 250 322 C 236 368 200 396 158 396 C 116 396 90 374 82 336 C 76 306 58 292 50 268 C 42 246 48 222 62 208 C 74 196 80 186 82 164 C 88 104 104 36 156 34 Z" class="mouse-shell" aria-hidden="true" />
              <path d="M 98 186 C 128 194 192 196 248 184" class="mouse-seam mouse-seam--palm" aria-hidden="true" />

              <g class="mouse-btn-group" data-btn="LMB" role="button" tabindex="0" aria-pressed="false" aria-label="Ляв бутон">
                <path d="M 86 168 C 90 108 108 46 152 40 L 152 66 L 146 66 L 146 150 L 152 150 L 152 178 C 128 180 104 176 86 168 Z" class="mouse-btn" />
                <text x="118" y="120" class="mouse-btn-label" aria-hidden="true">LMB</text>
              </g>

              <g class="mouse-btn-group" data-btn="RMB" role="button" tabindex="0" aria-pressed="false" aria-label="Десен бутон">
                <path d="M 168 40 C 214 42 248 80 256 134 C 258 150 258 162 256 172 C 230 180 198 182 168 178 L 168 150 L 174 150 L 174 66 L 168 66 Z" class="mouse-btn" />
                <text x="212" y="122" class="mouse-btn-label" aria-hidden="true">RMB</text>
              </g>

              <rect x="146" y="66" width="28" height="84" rx="14" class="mouse-scroll-slot" aria-hidden="true" />

              <g class="mouse-btn-group" data-btn="Scroll" role="button" tabindex="0" aria-pressed="false" aria-label="Скрол колелце, среден бутон">
                <rect x="151" y="72" width="18" height="72" rx="9" class="mouse-btn mouse-btn--scroll" />
                <path d="M 154 84 H 166 M 154 92 H 166 M 154 100 H 166 M 154 108 H 166 M 154 116 H 166 M 154 124 H 166 M 154 132 H 166" class="mouse-wheel-ribs" aria-hidden="true" />
              </g>

              <g class="mouse-btn-group" data-btn="M4" role="button" tabindex="0" aria-pressed="false" aria-label="Страничен бутон Напред">
                <rect x="56" y="204" width="26" height="30" rx="10" class="mouse-btn" />
                <text x="69" y="220" class="mouse-btn-label mouse-btn-label--small" aria-hidden="true">M4</text>
              </g>

              <g class="mouse-btn-group" data-btn="M5" role="button" tabindex="0" aria-pressed="false" aria-label="Страничен бутон Назад">
                <rect x="48" y="240" width="26" height="30" rx="10" class="mouse-btn" />
                <text x="61" y="256" class="mouse-btn-label mouse-btn-label--small" aria-hidden="true">M5</text>
              </g>

              <circle cx="168" cy="292" r="15" class="mouse-logo-ring" aria-hidden="true" />
              <path d="M 112 372 C 136 386 184 386 210 370" class="mouse-rgb-strip" aria-hidden="true" />
            </svg>
          </div>
        </div>
      </section>

      <section class="settings-menu" aria-label="Всички настройки">
        <div class="layout-switcher">
          <button type="button" class="connected-devices-btn layout-switcher__btn" data-settings-menu-btn>
            Всички настройки ▾
          </button>
          <div id="settings-options" class="layout-options">
            <button type="button" class="layout-option settings-tab" data-tab="1">Цвят</button>
            <button type="button" class="layout-option settings-tab" data-tab="2">Ефекти</button>
            <button type="button" class="layout-option settings-tab" data-tab="3">Яркост и скорост</button>
            <button type="button" class="layout-option settings-tab" data-tab="4">Профили</button>
            <button type="button" class="layout-option settings-tab" data-tab="5">Функции на бутоните</button>
            <button type="button" class="layout-option settings-tab" data-tab="6">Запис в мишката</button>
          </div>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
    <script src="rgb.js"></script>
    <script src="bindings.js"></script>
    <script src="logitech.js"></script>
  </body>
</html>
