<!DOCTYPE html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Избор на периферия</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="space-background"></canvas>

    <main class="app homepage glass-panel">
      <header class="app-header">
        <button type="button" id="connected-devices-btn" class="back-button">
          <svg viewBox="0 0 24 24" class="back-icon" aria-hidden="true">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
          </svg>
          Свързани
        </button>
      </header>

      <div class="device-cards">
        <a href="keyboard.html" class="device-card">
          <svg class="device-icon" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="2" y="4" width="20" height="16" rx="2" ry="2"></rect>
            <line x1="6" y1="8" x2="6.01" y2="8"></line>
            <line x1="10" y1="8" x2="10.01" y2="8"></line>
            <line x1="14" y1="8" x2="14.01" y2="8"></line>
            <line x1="18" y1="8" x2="18.01" y2="8"></line>
            <line x1="6" y1="12" x2="6.01" y2="12"></line>
            <line x1="10" y1="12" x2="10.01" y2="12"></line>
            <line x1="14" y1="12" x2="14.01" y2="12"></line>
            <line x1="18" y1="12" x2="18.01" y2="12"></line>
            <line x1="7" y1="16" x2="17" y2="16"></line>
          </svg>
          Клавиатура
        </a>

        <a href="mouse.html" class="device-card">
          <svg class="device-icon" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="5" y="2" width="14" height="20" rx="7"></rect>
            <line x1="12" y1="6" x2="12" y2="10"></line>
          </svg>
          Мишка
        </a>

        <a href="headphones.html" class="device-card">
          <svg class="device-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 18v-6a9 9 0 0 1 18 0v6"></path>
            <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path>
          </svg>
          Слушалки
        </a>

        <a href="webcam.html" class="device-card">
          <svg class="device-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="10" r="8"></circle>
            <circle cx="12" cy="10" r="3"></circle>
            <line x1="7" y1="22" x2="17" y2="22"></line>
            <line x1="12" y1="18" x2="12" y2="22"></line>
          </svg>
          Web Камера
        </a>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
