<!DOCTYPE html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Конфигуратор на клавиатура</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="space-background"></canvas>

    <main class="app glass-panel">
      <header class="app-header">
        <a href="index.html" class="back-button">
          <svg viewBox="0 0 24 24" class="back-icon" aria-hidden="true">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
          Назад
        </a>
      </header>

      <div class="layout-switcher">
        <button type="button" class="connected-devices-btn layout-switcher__btn">
          Други проценти на клавиатурите ▾
        </button>
        <div id="layout-options" class="layout-options" data-keyboard-layout-options></div>
      </div>

      <button type="button" id="connected-devices-btn" class="connected-devices-btn">
        Всички свързани устройства
      </button>

      <section id="device-preview" class="device-preview" aria-label="Визуализация на устройство">
        <div id="device-display-area" class="device-display-area" data-keyboard-display></div>
      </section>

      <section class="settings-menu" aria-label="Меню за настройки">
        <p class="settings-menu__title">Меню за всички настройки</p>
        <div class="settings-tabs" role="tablist">
          <button type="button" class="settings-tab" data-tab="1">Цвят</button>
          <button type="button" class="settings-tab" data-tab="2">Ефекти</button>
          <button type="button" class="settings-tab" data-tab="3">Яркост и скорост</button>
          <button type="button" class="settings-tab" data-tab="4">Профили</button>
        </div>
      </section>
    </main>

    <script src="keyboard-layouts.js"></script>
    <script src="script.js"></script>
    <script src="rgb.js"></script>
  </body>
</html>
