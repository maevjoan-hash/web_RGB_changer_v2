<!DOCTYPE html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Конфигуратор на мишка - Геймърска (FPS/Action)</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="space-background"></canvas>

    <main class="app glass-panel">
      <header class="app-header">
        <a href="index.html" class="back-button">
          <svg viewBox="0 0 24 24" class="back-icon" aria-hidden="true">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
          Назад
        </a>

        <button type="button" id="connected-devices-btn" class="back-button">
          <svg viewBox="0 0 24 24" class="back-icon" aria-hidden="true">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
          </svg>
          Свързани
        </button>
      </header>

      <div class="layout-switcher">
        <button type="button" class="connected-devices-btn layout-switcher__btn">
          Видове мишки ▾
        </button>
        <div id="layout-options" class="layout-options">
          <a href="mouse.html" class="layout-option">Стандартна (Офис) • 3–5 бутона</a>
          <a href="mouse-gaming.html" class="layout-option active" aria-current="page">Геймърска (FPS/Action) • 6–9 бутона</a>
        </div>
      </div>

      <section id="device-preview" class="device-preview mouse-preview" aria-label="Визуализация на геймърска мишка">
        <div id="device-display-area" class="device-display-area mouse-display-area">
          <div class="mouse-stage">
            <svg class="mouse-svg mouse-svg--gaming" viewBox="0 0 340 440" role="group" aria-label="Геймърска FPS мишка с 9 бутона">
              <path d="M 170 6 C 170 16 170 22 170 32" class="mouse-cable" aria-hidden="true" />
              <path d="M 170 30 C 224 30 262 64 272 122 L 280 198 C 284 250 278 302 262 346 C 246 390 210 414 170 414 C 130 414 102 394 90 362 L 86 334 C 70 334 50 326 38 306 C 28 288 30 266 42 250 L 60 226 C 68 214 72 200 74 182 L 78 122 C 86 64 118 30 170 30 Z" class="mouse-shell" aria-hidden="true" />
              <path d="M 86 334 C 70 334 50 326 38 306 C 28 288 30 266 42 250 L 60 226 C 66 248 74 276 80 304 Z" class="mouse-thumb-rest" aria-hidden="true" />
              <path d="M 112 214 L 138 236 M 228 214 L 202 236 M 120 252 L 140 268 M 220 252 L 200 268" class="mouse-accent" aria-hidden="true" />
              <path d="M 98 344 C 116 382 142 400 170 402 C 198 400 224 382 242 344" class="mouse-rgb-strip" aria-hidden="true" />

              <g class="mouse-btn-group" data-btn="Fire" role="button" tabindex="0" aria-pressed="false" aria-label="Бърз Rapid-Fire бутон">
                <path d="M 104 56 C 92 70 84 92 82 118 L 80 182 C 86 186 92 188 98 188 L 100 122 C 102 96 104 74 104 56 Z" class="mouse-btn mouse-btn--accent" />
                <text x="91" y="140" class="mouse-btn-label mouse-btn-label--tiny" aria-hidden="true">Fire</text>
              </g>

              <g class="mouse-btn-group" data-btn="LMB" role="button" tabindex="0" aria-pressed="false" aria-label="Ляв основен бутон">
                <path d="M 112 48 C 128 38 146 33 162 32 L 162 60 L 154 60 L 154 178 L 162 178 L 162 196 C 140 198 120 194 104 190 L 106 122 C 108 94 110 68 112 48 Z" class="mouse-btn" />
                <text x="130" y="122" class="mouse-btn-label" aria-hidden="true">LMB</text>
              </g>

              <g class="mouse-btn-group" data-btn="RMB" role="button" tabindex="0" aria-pressed="false" aria-label="Десен основен бутон">
                <path d="M 178 32 C 222 34 256 66 264 120 L 270 186 C 250 194 214 198 178 196 L 178 178 L 186 178 L 186 60 L 178 60 Z" class="mouse-btn" />
                <text x="224" y="122" class="mouse-btn-label" aria-hidden="true">RMB</text>
              </g>

              <rect x="154" y="60" width="32" height="118" rx="12" class="mouse-scroll-slot" aria-hidden="true" />

              <g class="mouse-btn-group" data-btn="Scroll" role="button" tabindex="0" aria-pressed="false" aria-label="Геймърски скрол, среден бутон">
                <rect x="160" y="66" width="20" height="56" rx="9" class="mouse-btn mouse-btn--scroll" />
                <path d="M 163 76 H 177 M 163 84 H 177 M 163 92 H 177 M 163 100 H 177 M 163 108 H 177" class="mouse-wheel-ribs" aria-hidden="true" />
              </g>

              <g class="mouse-btn-group" data-btn="DPI+" role="button" tabindex="0" aria-pressed="false" aria-label="Увеличаване на чувствителността">
                <rect x="158" y="128" width="24" height="20" rx="5" class="mouse-btn" />
                <text x="170" y="138" class="mouse-btn-label mouse-btn-label--tiny" aria-hidden="true">DPI+</text>
              </g>

              <g class="mouse-btn-group" data-btn="DPI-" role="button" tabindex="0" aria-pressed="false" aria-label="Намаляване на чувствителността">
                <rect x="158" y="152" width="24" height="20" rx="5" class="mouse-btn" />
                <text x="170" y="162" class="mouse-btn-label mouse-btn-label--tiny" aria-hidden="true">DPI-</text>
              </g>

              <g class="mouse-btn-group" data-btn="M4" role="button" tabindex="0" aria-pressed="false" aria-label="Страничен макро бутон 1">
                <path d="M 66 200 C 72 198 80 198 84 202 L 82 236 C 76 238 68 238 64 234 Z" class="mouse-btn" />
                <text x="74" y="219" class="mouse-btn-label mouse-btn-label--small" aria-hidden="true">M4</text>
              </g>

              <g class="mouse-btn-group" data-btn="M5" role="button" tabindex="0" aria-pressed="false" aria-label="Страничен макро бутон 2">
                <path d="M 62 242 C 68 240 76 240 80 244 L 78 278 C 72 280 64 280 60 276 Z" class="mouse-btn" />
                <text x="70" y="261" class="mouse-btn-label mouse-btn-label--small" aria-hidden="true">M5</text>
              </g>

              <g class="mouse-btn-group" data-btn="Sniper" role="button" tabindex="0" aria-pressed="false" aria-label="Страничен бутон за прицелване и нисък DPI">
                <path d="M 44 250 C 48 246 54 244 58 246 L 56 284 C 52 288 44 286 40 282 Z" class="mouse-btn mouse-btn--accent" />
                <text x="49" y="266" class="mouse-btn-label mouse-btn-label--tiny" aria-hidden="true">Aim</text>
              </g>

              <polygon points="170,286 188,306 170,326 152,306" class="mouse-gaming-logo" aria-hidden="true" />
            </svg>
          </div>
        </div>
      </section>

      <div class="save-bar" aria-label="Профили и запис">
        <div class="save-bar__profiles" data-profiles></div>
        <div class="save-bar__device" data-device-actions></div>
      </div>

      <div class="settings-columns">
        <section class="settings-menu settings-column" data-column="lighting" aria-label="Подсветка">
          <div class="layout-switcher">
            <button type="button" class="connected-devices-btn layout-switcher__btn" data-settings-menu-btn data-menu-title="Подсветка">
              Подсветка ▾
            </button>
            <div id="lighting-options" class="layout-options">
              <button type="button" class="layout-option settings-tab" data-tab="1">Цвят</button>
              <button type="button" class="layout-option settings-tab" data-tab="2">Ефекти</button>
              <button type="button" class="layout-option settings-tab" data-tab="3">Яркост и скорост</button>
            </div>
          </div>
          <div class="settings-panels"></div>
        </section>

        <section class="settings-menu settings-column" data-column="buttons" aria-label="Програмируеми бутони">
          <div class="layout-switcher">
            <button type="button" class="connected-devices-btn layout-switcher__btn" data-settings-menu-btn data-menu-title="Бутони">
              Бутони ▾
            </button>
            <div id="buttons-options" class="layout-options">
              <button type="button" class="layout-option settings-tab" data-tab="5">Функции на бутоните</button>
              <button type="button" class="layout-option settings-tab" data-tab="6">Мишка и DPI</button>
            </div>
          </div>
          <div class="settings-panels"></div>
        </section>
      </div>
    </main>

    <script src="i18n.js"></script>
    <script src="i18n-en.js"></script>
    <script src="script.js"></script>
    <script src="rgb.js"></script>
    <script src="bindings.js"></script>
    <script src="logitech.js"></script>
  </body>
</html>
