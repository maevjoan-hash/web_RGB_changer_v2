<!DOCTYPE html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Конфигуратор - Web Камера</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="space-background"></canvas>

    <main class="app glass-panel">
      <header class="app-header">
        <a href="index.html" class="back-button">
          <svg viewBox="0 0 24 24" class="back-icon" aria-hidden="true">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
          Назад
        </a>

        <button type="button" id="connected-devices-btn" class="back-button">
          <svg viewBox="0 0 24 24" class="back-icon" aria-hidden="true">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
          </svg>
          Свързани
        </button>
      </header>

      <section class="device-preview" aria-label="Образ от камерата">
        <div class="device-display-area mouse-display-area">
          <div class="mouse-stage webcam-stage">
            <div class="webcam-frame">
              <video id="webcam-video" class="webcam-video" autoplay playsinline muted></video>
              <div class="webcam-placeholder" id="webcam-placeholder">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M23 7l-7 5 7 5V7z"></path>
                  <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
                </svg>
                <span>Камерата е спряна</span>
              </div>
              <span class="webcam-badge" id="webcam-badge" hidden></span>
            </div>
          </div>
        </div>
      </section>

      <div class="save-bar" aria-label="Камера и профили">
        <div class="save-bar__profiles" data-profiles></div>
        <div class="save-bar__device" data-device-actions></div>
      </div>

      <div class="settings-columns">
        <section class="settings-menu settings-column" data-column="image" aria-label="Картина">
          <div class="layout-switcher">
            <button type="button" class="connected-devices-btn layout-switcher__btn" data-settings-menu-btn data-menu-title="Картина">
              Картина ▾
            </button>
            <div id="image-options" class="layout-options">
              <button type="button" class="layout-option settings-tab" data-tab="1">Светлина и цвят</button>
              <button type="button" class="layout-option settings-tab" data-tab="2">Експонация и баланс на бялото</button>
            </div>
          </div>
          <div class="settings-panels"></div>
        </section>

        <section class="settings-menu settings-column" data-column="camera" aria-label="Камера">
          <div class="layout-switcher">
            <button type="button" class="connected-devices-btn layout-switcher__btn" data-settings-menu-btn data-menu-title="Камера">
              Камера ▾
            </button>
            <div id="camera-options" class="layout-options">
              <button type="button" class="layout-option settings-tab" data-tab="3">Фокус и мащаб</button>
              <button type="button" class="layout-option settings-tab" data-tab="4">Образ и информация</button>
            </div>
          </div>
          <div class="settings-panels"></div>
        </section>
      </div>
    </main>

    <script src="script.js"></script>
    <script src="webcam.js"></script>
  </body>
</html>
