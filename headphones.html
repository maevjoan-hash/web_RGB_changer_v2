<!DOCTYPE html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Конфигуратор - Слушалки</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="space-background"></canvas>

    <main class="app glass-panel">
      <header class="app-header">
        <a href="index.html" class="back-button">
          <svg viewBox="0 0 24 24" class="back-icon" aria-hidden="true">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
          Назад
        </a>

        <button type="button" id="connected-devices-btn" class="back-button">
          <svg viewBox="0 0 24 24" class="back-icon" aria-hidden="true">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
          </svg>
          Свързани
        </button>
      </header>

      <section id="device-preview" class="device-preview" aria-label="Визуализация на слушалките">
        <div class="device-display-area mouse-display-area">
          <div class="mouse-stage headphones-stage">
            <svg class="headphones-svg" data-mode="unknown" viewBox="0 0 420 360" role="img"
              aria-label="Слушалки Sony WH-1000XM5">
              <!-- Звукови вълни: шумопотискане (вълните се гасят) или околен звук (вълните влизат) -->
              <g class="hp-waves" aria-hidden="true">
                <path d="M 26 212 C 14 236 14 268 26 292" />
                <path d="M 10 198 C -6 232 -6 272 10 306" />
                <path d="M 394 212 C 406 236 406 268 394 292" />
                <path d="M 410 198 C 426 232 426 272 410 306" />
              </g>

              <!-- Лента за глава: тънка дъга с мека възглавница -->
              <path d="M 92 196 C 92 70 152 30 210 30 C 268 30 328 70 328 196" class="hp-band" aria-hidden="true" />
              <path d="M 112 150 C 118 82 162 50 210 50 C 258 50 302 82 308 150" class="hp-band-pad" aria-hidden="true" />

              <!-- Плъзгачи от лентата към чашките -->
              <path d="M 92 190 L 92 214" class="hp-slider" aria-hidden="true" />
              <path d="M 328 190 L 328 214" class="hp-slider" aria-hidden="true" />

              <!-- Лява чашка -->
              <g class="hp-cup" aria-hidden="true">
                <rect x="40" y="206" width="104" height="132" rx="46" class="hp-cup-shell" />
                <rect x="54" y="220" width="76" height="104" rx="36" class="hp-cup-face" />
                <circle cx="70" cy="234" r="2.4" class="hp-mic" />
                <circle cx="114" cy="234" r="2.4" class="hp-mic" />
                <text x="92" y="278" class="hp-side">L</text>
                <rect x="140" y="250" width="6" height="16" rx="3" class="hp-button" />
                <rect x="140" y="274" width="6" height="22" rx="3" class="hp-button" />
              </g>

              <!-- Дясна чашка (сензорен панел) -->
              <g class="hp-cup" aria-hidden="true">
                <rect x="276" y="206" width="104" height="132" rx="46" class="hp-cup-shell" />
                <rect x="290" y="220" width="76" height="104" rx="36" class="hp-cup-face hp-cup-face--touch" />
                <circle cx="306" cy="234" r="2.4" class="hp-mic" />
                <circle cx="350" cy="234" r="2.4" class="hp-mic" />
                <text x="328" y="278" class="hp-side">R</text>
              </g>

              <!-- Състояние в средата -->
              <text x="210" y="150" class="hp-status" id="hp-status-mode">Не са свързани</text>
              <text x="210" y="176" class="hp-status hp-status--small" id="hp-status-battery"></text>
            </svg>
          </div>
        </div>
      </section>

      <div class="save-bar" aria-label="Връзка със слушалките">
        <div class="save-bar__device" data-device-actions></div>
      </div>

      <div class="settings-columns">
        <section class="settings-menu settings-column" data-column="sound" aria-label="Звук">
          <div class="layout-switcher">
            <button type="button" class="connected-devices-btn layout-switcher__btn" data-settings-menu-btn data-menu-title="Звук">
              Звук ▾
            </button>
            <div id="sound-options" class="layout-options">
              <button type="button" class="layout-option settings-tab" data-tab="1">Шумопотискане</button>
              <button type="button" class="layout-option settings-tab" data-tab="2">Еквалайзер</button>
            </div>
          </div>
          <div class="settings-panels"></div>
        </section>

        <section class="settings-menu settings-column" data-column="device" aria-label="Слушалки">
          <div class="layout-switcher">
            <button type="button" class="connected-devices-btn layout-switcher__btn" data-settings-menu-btn data-menu-title="Слушалки">
              Слушалки ▾
            </button>
            <div id="device-options" class="layout-options">
              <button type="button" class="layout-option settings-tab" data-tab="3">Функции</button>
              <button type="button" class="layout-option settings-tab" data-tab="4">Батерия и информация</button>
            </div>
          </div>
          <div class="settings-panels"></div>
        </section>
      </div>
    </main>

    <script src="i18n.js"></script>
    <script src="i18n-en.js"></script>
    <script src="script.js"></script>
    <script src="sony-headphones.js"></script>
  </body>
</html>
